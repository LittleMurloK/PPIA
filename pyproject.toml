[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PPIA"
version = "0.1.8"
description = "calculate per-frame minimum distances between a protein and its periodic images in MD trajectories"
requires-python = ">=3.10"

dependencies = [
    "MDAnalysis",
    "numpy",
    "matplotlib",
    "tqdm",
]

[project.scripts]
PPIA = "pid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pid*"]
namespaces = false